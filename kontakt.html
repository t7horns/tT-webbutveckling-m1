<!DOCTYPE html>
<html lang="sv">
        
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>tT-WOD - Kontakt</title>
    </head>

    <body>
        <header>
            <p>tT-WOD</p>
            <img src="images/openclipart-vectors-barbell-155218.svg" alt="Logotyp för hemsidan/varumärket" width="128" height="128">
            <nav>
                <ul>
                    <li><a href="index.html">Hem</a></li>
                    <li><a href="hobby.html">Träning och inspiration</a></li>
                    <li><a href="kontakt.html">Kontakt</a></li>
                </ul>
            </nav> 
        </header> 

        <main>
            <h1>Kontaktformulär</h1>
            
            <form>
                <label for="name">Namn:</label>
                <br>
                <input type="text" id="name" name="name" placeholder="Ditt namn" required>
                <br>            
                <label for="message">Meddelande:</label>
                <br>
                <textarea id="message" name="message" placeholder="Ditt meddelande" rows="7" required></textarea>
                <br>
                <fieldset>
                    <legend>Hur vill du bli kontaktad?</legend>
            
                    <label for="contact-method-email">Email</label>
                    <input type="radio" id="contact-method-email" name="contact-method" value="email">
                    
                    <label for="contact-method-telephone">Telefon</label>
                    <input type="radio" id="contact-method-telephone" name="contact-method" value="telephone">
                </fieldset>
                <br>
                <button type="submit">Skicka</button>
            </form>

            <p>Du kan också nå mig direkt på <a href="mailto:placeholder@placeholder.email">placeholder@placeholder.email</a></p>
        </main>

        <footer>
            <hr class="divider">
            <p>© 2026 Mathias Thorgren</p>
            <a href="kontakt.html">Kontakt</a>
            <aside aria-label="projektinformation">
                <p>OBS: Detta är en fiktiv webbplats skapad för ett skolprojekt.</p>
            </aside>
        </footer>

    </body>

</html>
